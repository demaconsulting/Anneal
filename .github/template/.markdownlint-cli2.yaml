---
# Markdown Linting Configuration
#
# DO NOT MODIFY: These rules represent coding standards.
ignores:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/generated/**'
  - '**/.agent-logs/**'
config:
  # Require ATX-style headers
  MD003:
    style: atx

  # Consistent unordered list markers
  MD004:
    style: dash

  # Set consistent indentation for nested lists
  MD007:
    indent: 2

  # Line length - disabled (no limit enforced)
  MD013: false

  # Allow multiple top-level headers per document
  MD025: false

  # Allow inline HTML (XML comments used in templates)
  MD033: false

  # Disable first-line-heading: template files may begin with a TEMPLATE-DIRECTIVE
  # comment or YAML front matter before the first heading.
  MD041: false
