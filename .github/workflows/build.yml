---
# Continuous integration for the Anneal payload itself.
#
# Most of what Anneal ships is prose and scripts, plus one script that is
# genuinely enforced - check-contracts.ps1 - and test-check-contracts.ps1 is
# what proves that script still fails in every way its skill file documents.
# Since the Toolkit landed there is also a .NET solution to build, so this
# repository now runs build.ps1 like any product repository does.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ORDERING MATTERS: build.ps1 runs before lint.ps1 because lint.ps1
      # invokes check-contracts.ps1, and the clause-to-test pass verification
      # reads the results build.ps1 produces - the TRX from the Toolkit tests
      # and the text results of the two PowerShell suites alike. Linting first
      # would leave no results to read, and the pass check would be skipped
      # while CI still reported success.
      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - name: Lint
        shell: pwsh
        run: ./lint.ps1
