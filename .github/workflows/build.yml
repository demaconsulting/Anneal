---
# Continuous integration for the Anneal payload itself.
#
# Anneal ships no compiled code, so there is no build step. What it ships is a
# payload of prompt files plus one script that is genuinely enforced -
# check-contracts.ps1 - and test-check-contracts.ps1 is what proves that script
# still fails in every way its skill file documents.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The payload's only mechanically enforced rule. A regression here is
      # silent - every other rule Anneal ships is visible to a reader. It runs
      # before the lint gate because it writes the test results that the
      # contract check inside lint.ps1 reads.
      - name: Test check-contracts.ps1
        shell: pwsh
        run: ./test-check-contracts.ps1

      - name: Lint
        shell: pwsh
        run: ./lint.ps1
